# 未来の自分からの電話 - 設定ファイル(F-62)
# 変更後はサーバーを再起動してください。

server:
  host: 127.0.0.1
  port: 8000
  open_browser: false           # true にすると起動時に既定ブラウザを開く(通常は start スクリプトが Chrome を開く)

experience:
  future_years: 10              # 何年後の自分か (C-08)
  caller_name: null             # null なら "{future_years}年後の自分" を表示
  record_min_sec: 20            # 録音の下限秒数 (F-04)
  record_max_sec: 90            # 録音の上限秒数。到達で自動送信 (F-05)
  ring_timeout_sec: 30          # 着信に応答がない場合に不在着信にするまでの秒数 (F-45)
  missed_call_display_sec: 4    # 不在着信の表示秒数
  end_screen_sec: 15            # 終話画面から待機画面に戻るまでの秒数 (F-51)
  consent_idle_sec: 60          # 同意画面で操作がない場合に待機画面へ戻る秒数
  low_volume_threshold: 0.02    # 音量不足の判定しきい値(RMS 0〜1) (F-08)
  staff_reset_hold_ms: 3000     # スタッフ用リセットの長押し時間(ミリ秒) (F-60)
  status_poll_ms: 1000          # 状態ポーリング間隔(ミリ秒)
  reply_wait:                   # 疑似的なやりとり: 問いかけの後に体験者の返事を待つ(音量だけ見る。録音・送信はしない)
    enabled: true               # false なら待たずに続けて再生
    no_speech_sec: 5            # 誰も話さないとき、この秒数で続きを再生
    silence_end_sec: 1.2        # 話し終わりと判定する無音の秒数
    max_reply_sec: 15           # 話し続けてもこの秒数で打ち切って続きを再生
    min_pause_sec: 0.6          # スピーカー音の回り込み防止。再生停止からこの秒数後に判定開始
    speech_threshold: 0.03      # 話していると判定する音量(RMS 0〜1)

audio:                          # 音量設定 (N-21)
  ringtone_volume: 0.8          # 着信音の音量 0〜1
  call_volume: 1.0              # 通話音声の音量 0〜1
  ambient_enabled: true         # 通話中に生活音(カフェのざわめき等)をかすかに流す
  ambient_volume: 0.12          # 環境音の音量 0〜1
  ambient_file: null            # 例: "assets/ambient_cafe.mp3"(frontend/ からの相対パス)。null ならブラウザで自動生成

pipeline:
  total_timeout_sec: 240        # 生成の上限秒数。超えると、できた分だけで着信(1つもできなければブラウザ音声合成) (N-01)
  ring_after_chunks: all        # all(全部できてから着信。通話中の途切れなし) | 数字(何チャンクできたら着信を開始するか (F-33))
  work_dir: null                # 一時ファイルの置き場。null ならOSの一時ディレクトリ

reference:                      # 参照音声の前処理 (audio_prep)
  max_sec: 30                   # 参照音声の最大秒数
  min_voiced_sec: 8             # 声クローンに必要な有声区間の最小秒数
  denoise: false                # ノイズ除去。true にすると声色が似にくくなる(実測 類似度 -0.04)。騒がしい会場でノイズが目立つ時だけ true

stt:
  engine: faster_whisper        # faster_whisper | mock
  model_size: small             # tiny | base | small | medium
  compute_type: int8
  beam_size: 1
  language: ja

llm:
  engine: ollama                # ollama(ローカル。外部通信なし) | gemini(クラウド) | template(常にテンプレート)
  model: gemma3:12b             # ollama のモデル名。取得: ollama pull gemma3:12b
  ollama_url: http://127.0.0.1:11434
  ollama_keep_alive: 30m        # モデルをメモリに置く時間(初回の待ちを避ける)
  timeout_sec: 90               # ローカル生成の上限秒数 (F-23)。超えたらテンプレートに切替。短い/話に触れない台本は 1 回だけ再生成(経過が半分以内のとき)
  temperature: 0.9
  min_transcript_chars: 10      # これ未満の認識結果はテンプレートに切替 (F-12)
  target_chars_min: 240         # ローカル合成は音声の約 3 倍の時間がかかるため短め
  target_chars_max: 340         # 相づち・間投詞を含めた上限
  reply_pauses: 1               # 問いかけの数 0〜2(0 なら 1 パートのみ)
  # gemini を使う場合のみ:
  fallback_models: [gemini-3.1-flash-lite, gemini-3.8-flash]
  quota_cooldown_sec: 120

tts:
  engine: chatterbox            # chatterbox(ローカル・声クローン) | gemini_openvoice | openvoice | melo | mock
  chunk_unit: auto              # auto | part | group | sentence(auto = gemini_openvoice なら part、chatterbox なら group、それ以外は sentence)
  chunk_chars: 100              # group のとき、1 回の合成にまとめる文字数(1 回ごとに約 5 秒の固定コストがあるため、文ごとより速い)
  device: cpu                   # cpu(M5 実測で安定。約 3 倍の時間で合成) | mps(実測で遅く不安定。文ごとに遅くなる) | auto
  chatterbox:
    language_id: ja
    exaggeration: 0.5           # 感情表現の強さ 0.25〜2.0
    cfg_weight: 0.5             # 低いほどゆっくり・参照音声の話し方に寄る
    temperature: 0.8
    max_retries: 2              # 無音・極端に短い/長い合成のとき再生成する回数
  age_voice_shift:              # Q-06: 未来の声を少し低くする加工
    enabled: false
    semitones: -1.0
  # 以下は openvoice / gemini_openvoice エンジン用(chatterbox では未使用)
  checkpoint_dir: models/OpenVoiceV2
  speed: 1.0
  tau: 0.5
  standard_voice_pitch_match: true

phone_fx:                       # 電話音質エフェクト (F-34)
  enabled: true
  low_hz: 250                   # 電話帯域の下限(300 だと声色の類似度が下がる)
  high_hz: 3800
  noise_db: -45
  compress: true
  sample_rate: 16000

logging:
  dir: logs                     # リポジトリ直下からの相対パス
  level: INFO
